<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Archive</title>
<link rel="icon" href="/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/translations.js"></script>
<script src="js/i18n.js"></script>
<style>
  :root{
    --bg:#0c0b09; --bg-raised:#141210; --hairline:#2a2621;
    --gold:#c9a24b; --gold-bright:#e0bd6b; --cream:#f2ede2; --cream-dim:#b9b2a3; --mono:#6b6357; --error:#c9605a;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background: var(--bg); color: var(--cream); font-family:'Jost', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .box{ text-align:center; max-width:400px; }
  .shield{ width:56px; height:56px; margin:0 auto 20px; }
  .spinner{
    width:28px; height:28px; border:2px solid var(--hairline); border-top-color: var(--gold);
    border-radius:50%; margin:0 auto 16px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  p{ color: var(--cream-dim); font-size:0.95rem; line-height:1.5; }
  .error-icon{
    width:44px; height:44px; margin:0 auto 16px; border:1px solid var(--error); border-radius:50%;
    display:flex; align-items:center; justify-content:center; color: var(--error); font-size:1.3rem;
  }
  h1{ font-family:'Cormorant Garamond', serif; font-size:1.4rem; font-weight:600; margin: 0 0 10px; }
  a.btn{
    display:inline-block; margin-top:20px; background: var(--gold); color:#0c0b09; text-decoration:none;
    font-family:'IBM Plex Mono', monospace; font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase;
    padding:12px 22px;
  }
  .header-logo{ width:44px; height:auto; margin:0 auto 20px; display:block; }
  .model-photo{
    width:120px; height:120px; margin:0 auto 18px; border-radius:50%;
    object-fit:cover; border:1px solid var(--hairline); display:none;
  }
  .choice-actions{ display:flex; flex-direction:column; gap:12px; margin-top:24px; }
  .choice-actions a{
    display:block; text-decoration:none; padding:16px 22px;
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; letter-spacing:0.08em; text-transform:uppercase;
  }
  .choice-actions .primary{ background: var(--gold); color:#0c0b09; }
  .choice-actions .secondary{ background:none; border:1px solid var(--hairline); color: var(--cream); }
  .choice-actions .secondary:hover{ border-color: var(--gold); color: var(--gold-bright); }
</style>
</head>
<body>

<div class="box" id="loadingBox">
  <div class="spinner"></div>
  <p data-i18n="nfc_loading">Looking up this record…</p>
</div>

<div class="box" id="errorBox" style="display:none;">
  <div class="error-icon">!</div>
  <h1 data-i18n="nfc_not_found_title">Tag not recognized</h1>
  <p data-i18n="nfc_not_found_desc">This tag isn't linked to a record on Mini Archive yet.</p>
  <a class="btn" href="index.html" data-i18n="nfc_back_home">Back to Mini Archive</a>
</div>

<div class="box" id="ownerChoiceBox" style="display:none;">
  <picture>
    <source srcset="images/logo-mark.webp" type="image/webp">
    <img class="header-logo" src="images/logo-mark-optimized.png" alt="Mini Archive">
  </picture>
  <img id="ownerModelPhoto" class="model-photo" alt="">
  <h1 data-i18n="nfc_owner_title">Welcome back</h1>
  <p data-i18n="nfc_owner_desc">What would you like to do?</p>
  <div class="choice-actions">
    <a class="primary" href="#" id="logGameLink" data-i18n="nfc_log_game">Log Game</a>
    <a class="secondary" href="#" id="viewModelLink" data-i18n="nfc_view_model">View Record</a>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://oesjjvrofwlhcxilwaen.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lc2pqdnJvZndsaGN4aWx3YWVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3Mzg5MDEsImV4cCI6MjEwMDMxNDkwMX0.Tazlir8gkSk8Y-aQMFOjmgadCgOhyaTfV8p8dWi9thw";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  (async () => {
    await initLanguage(supabaseClient);

    // This page is deliberately simple right now — resolve the opaque
    // token encoded on the tag to a real model via nfc_tags (NOT the
    // model's own Archive ID, which is public and sequential — anyone
    // could walk MA-2026-00000001, 000002, etc. and reach this page for a
    // model they never actually encountered a tag for), check whether the
    // current logged-in user is the owner, and route accordingly. Every
    // future upgrade (flagged lost/stolen? silently note the scan?) gets
    // added HERE later — the tag itself never needs to change, since it
    // only ever points at this one stable URL.
    const tagToken = new URLSearchParams(window.location.search).get("tag");

    if (!tagToken){
      document.getElementById("loadingBox").style.display = "none";
      document.getElementById("errorBox").style.display = "block";
      return;
    }

    const { data: tag, error: tagError } = await supabaseClient
      .from("nfc_tags")
      .select("id, miniature_id, first_scanned_at")
      .eq("token", tagToken)
      .eq("status", "active")
      .maybeSingle();

    if (tagError || !tag){
      // Deliberately identical to "token never existed" for a revoked tag
      // too — no information leak about which model it used to point to.
      document.getElementById("loadingBox").style.display = "none";
      document.getElementById("errorBox").style.display = "block";
      return;
    }

    const { data, error } = await supabaseClient
      .from("miniatures")
      .select("id, title, owner_profile_id, photos ( image_url, photo_type )")
      .eq("id", tag.miniature_id)
      .maybeSingle();

    if (error || !data){
      document.getElementById("loadingBox").style.display = "none";
      document.getElementById("errorBox").style.display = "block";
      return;
    }

    const { data: { session } } = await supabaseClient.auth.getSession();
    const isOwner = session && session.user.id === data.owner_profile_id;

    if (!isOwner){
      window.location.replace(`record.html?id=${data.id}`);
      return;
    }

    // First genuine scan by the actual owner — this is what turns "a tag
    // record exists" into "verified." Only ever set once.
    if (!tag.first_scanned_at){
      await supabaseClient.from("nfc_tags").update({ first_scanned_at: new Date().toISOString() }).eq("id", tag.id);
    }

    document.getElementById("loadingBox").style.display = "none";
    const frontPhoto = (data.photos || []).find(p => p.photo_type === "front");
    if (frontPhoto){
      const photoEl = document.getElementById("ownerModelPhoto");
      photoEl.src = frontPhoto.image_url;
      photoEl.alt = data.title || "";
      photoEl.style.display = "block";
    }
    document.getElementById("logGameLink").href = `log-game.html?id=${data.id}`;
    document.getElementById("viewModelLink").href = `record.html?id=${data.id}`;
    document.getElementById("ownerChoiceBox").style.display = "block";
  })();
</script>

</body>
</html>
