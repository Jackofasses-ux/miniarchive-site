<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — Mini Archive</title>
<link rel="icon" href="/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="js/i18n.js"></script>
<style>
  :root{
    --bg: #0c0b09;
    --bg-raised: #141210;
    --hairline: #2a2620;
    --gold: #c9a24b;
    --gold-bright: #e8c877;
    --cream: #ece6d8;
    --cream-dim: #a89f8c;
    --mono: #8a8072;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background: var(--bg); color: var(--cream);
    font-family:'Jost', sans-serif; font-weight:300; line-height:1.6;
  }
  a{ color:inherit; text-decoration:none; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem; letter-spacing:0.22em;
    text-transform:uppercase; color: var(--gold);
  }
  .rule-row{ display:flex; align-items:center; gap:14px; margin:18px 0 28px; }
  .rule-row .line{ height:1px; background: var(--hairline); flex:1; }
  .rule-row .diamond{ width:6px; height:6px; background: var(--gold); transform:rotate(45deg); flex-shrink:0; }

  header{
    position: sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:28px;
    padding:22px 56px;
    background: rgba(12,11,9,0.88);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--hairline);
  }
  header > nav{ margin-left:auto; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ display:flex; align-items:center; }
  .brand-mark img{ height:32px; width:auto; }
  .brand-name{ font-family:'Cormorant Garamond', serif; font-size:1.35rem; letter-spacing:0.06em; font-weight:600; }
  .nav-main-list{ display:table; border-spacing:34px 0; list-style:none; }
  .nav-main-list > li{ display:table-cell; vertical-align:middle; }
  .nav-main-list li a{ display:flex; align-items:center; height:20px; font-size:0.85rem; color: var(--cream-dim); position:relative; padding-bottom:4px; }
  nav ul li a.active{ color: var(--gold-bright); }
  .nav-main-list li a::after{ content:''; position:absolute; left:0; bottom:0; width:0; height:1px; background: var(--gold-bright); transition:width .35s ease; }
  .nav-main-list li a:hover{ color: var(--cream); }
  .nav-main-list li a:hover::after{ width:100%; }

  .nav-more{ position:relative; }
  .nav-more-btn{
    display:flex; align-items:center; height:20px; gap:5px;
    font-family:'Jost', sans-serif; font-size:0.85rem; letter-spacing:0.04em; font-weight:300;
    line-height:inherit; appearance:none; -webkit-appearance:none;
    color: var(--cream-dim); background:none; border:none; cursor:pointer; padding:0 0 4px; margin:0;
    transition: color .2s ease;
  }
  .nav-more-btn:hover{ color: var(--cream); }
  .nav-more-btn.has-active{ color: var(--gold-bright); }
  .nav-more-btn svg{ width:9px; height:9px; transition: transform .2s ease; }
  .nav-more-btn.open svg{ transform: rotate(180deg); }
  .nav-more-menu{
    position:absolute; top:calc(100% + 14px); left:0; min-width:160px;
    background: var(--bg-raised); border:1px solid var(--hairline); display:none; flex-direction:column; z-index:70;
  }
  .nav-more-menu.open{ display:flex; }
  .nav-more-menu a{
    padding:12px 16px; font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.05em;
    color: var(--cream-dim); border-bottom:1px solid var(--hairline);
  }
  .nav-more-menu a:last-child{ border-bottom:none; }
  .nav-more-menu a:hover{ color: var(--gold-bright); background: rgba(201,162,75,0.05); }
  .nav-more-menu a.active{ color: var(--gold); }
  nav{ display:block; }
  .user-group{ display:flex; align-items:center; gap:20px; }
  .user-toggle-wrap{ position:relative; }
  .user-toggle-wrap img{ width:36px !important; height:36px !important; }
  .nav-toggle, .user-toggle{
    display:none; background:none; border:none; cursor:pointer; padding:6px;
    color: var(--cream); align-items:center; justify-content:center;
  }
  .nav-toggle svg, .user-toggle svg{ width:24px; height:24px; }
  .btn-gold{
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase;
    color:#0c0b09; background: var(--gold); padding:11px 22px; border:1px solid var(--gold);
    transition: background .25s ease;
  }
  .btn-gold:hover{ background: var(--gold-bright); }
  .login-link{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color: var(--cream-dim); transition: color .2s ease; }
  .login-link:hover{ color: var(--gold-bright); }
  .lang-dropdown{ position:relative; }
  .lang-dropdown-btn{
    display:flex; align-items:center; height:20px; gap:6px;
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase;
    line-height:inherit; appearance:none; -webkit-appearance:none;
    color: var(--cream-dim); background:none; border:none; padding:0 0 4px; margin:0; cursor:pointer;
    transition: border-color .2s ease, color .2s ease;
  }
  .lang-dropdown-btn:hover{ color: var(--cream); }
  .lang-dropdown-btn svg{ width:9px; height:9px; }
  .lang-dropdown-menu{
    position:absolute; top:calc(100% + 8px); right:0; min-width:150px;
    background: var(--bg-raised); border:1px solid var(--hairline); display:none; flex-direction:column; z-index:70;
  }
  .lang-dropdown-menu.open{ display:flex; }
  .lang-dropdown-menu button{
    text-align:left; padding:10px 14px; font-family:'IBM Plex Mono', monospace; font-size:0.7rem; letter-spacing:0.05em;
    color: var(--cream-dim); background:none; border:none; border-bottom:1px solid var(--hairline); cursor:pointer; display:flex; align-items:center; gap:8px; width:100%;
  }
  .lang-dropdown-menu button:last-child{ border-bottom:none; }
  .lang-dropdown-menu button:hover{ color: var(--gold-bright); background: rgba(201,162,75,0.05); }
  .lang-dropdown-menu button.active{ color: var(--gold); }
  #authArea{ display:table; border-spacing:20px 0; position:relative; }
  #authArea > *{ display:table-cell; vertical-align:middle; }
  .user-menu-btn{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color:#0c0b09; background: var(--gold); border:1px solid var(--gold); padding:11px 20px; cursor:pointer; display:flex; align-items:center; gap:8px; transition: background 0.25s ease; }
  @media (min-width: 801px){ #userMenuBtn{ display:none; } }
  .user-menu-btn:hover{ background: var(--gold-bright); color:#0c0b09; }
  .user-menu-btn svg{ stroke:#0c0b09; }
  .user-menu-btn svg{ width:10px; height:10px; }
  .dropdown{
    position:absolute; top: calc(100% + 14px); right:0; min-width:200px;
    background: var(--bg-raised); border:1px solid var(--hairline); display:none; flex-direction:column; z-index:60;
  }
  .dropdown.open{ display:flex; }
  .dropdown a, .dropdown button{
    text-align:left; padding: 13px 18px; font-family:'IBM Plex Mono', monospace; font-size:0.7rem; letter-spacing:0.06em;
    text-transform:uppercase; color: var(--cream-dim); border-bottom:1px solid var(--hairline); background:none; border-left:none; border-right:none; border-top:none; cursor:pointer;
  }
  .dropdown a:last-child, .dropdown button:last-child{ border-bottom:none; }
  .dropdown a:hover, .dropdown button:hover{ color: var(--gold-bright); background: rgba(201,162,75,0.05); }
  .user-chip{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.08em; color: var(--cream-dim); }
  .logout-link{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; color: var(--cream-dim); cursor:pointer; background:none; border:none; padding:0; }
  .logout-link:hover{ color: var(--gold-bright); }

  .page-head{ padding: 70px 56px 20px; max-width:1280px; margin:0 auto; }
  .page-head h1{ font-family:'Cormorant Garamond', serif; font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight:500; }

  .controls{
    max-width:1280px; margin: 0 auto; padding: 0 56px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;
  }
  .search-box{
    flex:1; min-width:240px; max-width:420px;
    display:flex; align-items:center; gap:10px;
    border:1px solid var(--hairline); background: var(--bg-raised);
    padding: 12px 16px;
  }
  .search-box svg{ width:15px; height:15px; stroke: var(--mono); flex-shrink:0; }
  .search-box input{
    background:transparent; border:none; outline:none; color: var(--cream);
    font-family:'Jost', sans-serif; font-size:0.92rem; width:100%;
  }
  .search-box input::placeholder{ color: var(--mono); }

  .filters{ display:flex; gap:10px; flex-wrap:wrap; }
  .filter-btn{
    font-family:'IBM Plex Mono', monospace; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--cream-dim); border:1px solid var(--hairline); padding:9px 16px; background:transparent;
    cursor:pointer; transition: all .2s ease;
  }
  .filter-btn:hover{ border-color: var(--gold); color: var(--cream); }
  .filter-btn.active{ background: var(--gold); border-color: var(--gold); color:#0c0b09; }

  .result-count{
    max-width:1280px; margin: 0 auto; padding: 0 56px 10px;
    font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color: var(--mono); letter-spacing:0.05em;
  }

  .grid{
    max-width:1280px; margin: 0 auto; padding: 10px 56px 100px;
    display:grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
  }
  .mini-card{
    border:1px solid var(--hairline); background: var(--bg-raised); overflow:hidden;
    transition: border-color .3s ease, transform .3s ease; cursor:pointer;
  }
  .mini-card-link{ display:block; color:inherit; text-decoration:none; }
  .mini-card:hover{ border-color: var(--gold); transform: translateY(-4px); }
  .mini-card .thumb{
    height: 190px; position:relative;
    background: linear-gradient(160deg, #23201a, #131110);
    display:flex; align-items:center; justify-content:center;
  }
  .mini-card .thumb .placeholder-icon{ width:30px; height:30px; opacity:0.3; }
  .mini-card .thumb .id-tag{
    position:absolute; top:10px; left:10px;
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; letter-spacing:0.06em;
    color: var(--gold); border:1px solid rgba(201,162,75,0.4); padding:3px 7px;
  }
  .mini-card .thumb .status-tag{
    position:absolute; top:10px; right:10px;
    font-family:'IBM Plex Mono', monospace; font-size:0.6rem; letter-spacing:0.06em; text-transform:uppercase;
    padding:3px 7px; border:1px solid var(--hairline); color: var(--cream-dim);
  }
  .status-tag.finished{ color:#8fae7a; border-color: rgba(143,174,122,0.4); }
  .mini-card .thumb .card-edit-link{
    position:absolute; bottom:10px; right:10px; z-index:5;
    width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    background: rgba(12,11,9,0.75); border:1px solid var(--hairline); color: var(--cream-dim);
    font-size:0.85rem; text-decoration:none; transition: border-color .2s ease, color .2s ease;
  }
  .mini-card .thumb .card-edit-link:hover{ border-color: var(--gold); color: var(--gold-bright); }
  .status-tag.wip{ color: var(--gold-bright); border-color: rgba(201,162,75,0.4); }
  .status-tag.queued{ color: var(--mono); }

  .mini-card .info{ padding:16px 18px 20px; }
  .mini-card .info .name{ font-family:'Cormorant Garamond', serif; font-size:1.15rem; font-weight:600; }
  .mini-card .info .meta{
    margin-top:5px; font-family:'IBM Plex Mono', monospace; font-size:0.64rem;
    letter-spacing:0.05em; color: var(--mono); text-transform:uppercase;
  }

  .empty-state{
    grid-column: 1 / -1; text-align:center; padding: 70px 20px;
    color: var(--cream-dim);
  }
  .empty-state .eyebrow{ display:block; margin-bottom: 10px; }

  footer{
    border-top:1px solid var(--hairline); padding:32px 56px;
    display:flex; align-items:center; justify-content:space-between;
    font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color: var(--mono);
  }

  @media (max-width: 1100px){ .grid{ grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 800px){
    header{ padding:14px 20px; backdrop-filter: none; background: rgba(12,11,9,0.97); gap:12px; }
    .brand{ gap:8px; }
    .brand-name{ font-size: 1rem; }
    .nav-toggle, .user-toggle{ display:flex; }
    header > nav{ margin-left:0; position:static; }
    #navMenu{
      display:none; position:absolute; top:calc(100% + 14px); left:20px; width:min(78vw, 300px);
      background: var(--bg); border:1px solid var(--hairline);
      padding:8px 20px 16px; z-index:60;
    }
    #navMenu.open{ display:block; }
    .nav-main-list{ display:flex; flex-direction:column; gap:0; list-style:none; }
    .nav-main-list li{ border-top:1px solid var(--hairline); }
    .nav-main-list li:first-child{ border-top:none; }
    .nav-main-list li a{ display:block; padding:14px 0; }
    .nav-more{ padding: 4px 0; }
    .nav-more-btn{ width:100%; justify-content:space-between; padding:10px 0; }
    .nav-more-menu{
      display:none; position:static !important; border:none; background:none;
      padding-left:14px; margin-top:4px;
    }
    .nav-more-menu.open{ display:flex; }
    .nav-more-menu a{ border-bottom:none; padding:10px 0; }
    header > .lang-dropdown{ margin-left:auto; }
    .lang-dropdown-btn{ padding:6px 9px; font-size:0.62rem; }
    .user-group{
      display:none; position:absolute; top:calc(100% + 14px); right:20px; width:min(78vw, 260px);
      flex-direction:column; align-items:stretch; gap:14px; background: var(--bg); border:1px solid var(--hairline);
      padding:16px 20px; z-index:60;
    }
    .user-group.open{ display:flex; }
    .user-group #authArea{ display:flex; flex-direction:column; gap:10px; align-items:stretch; }
    .user-group #authArea .login-link{ padding:6px 0; }
    .user-group #authArea .btn-gold{ text-align:center; }
    /* Once the account panel is open, its contents should just be visible —
       no second tap on a nested toggle to reveal the same-level options. */
    .user-group .user-menu-btn{
      pointer-events:none; display:flex; justify-content:space-between; width:100%;
      padding-bottom:10px; border-bottom:1px solid var(--hairline); font-weight:600;
    }
    .user-group .user-menu-btn svg{ display:none; }
    .user-group .dropdown{
      display:flex !important; position:static !important; flex-direction:column;
      background:none; border:none; padding:0; box-shadow:none; min-width:0;
    }
    .user-group .dropdown a, .user-group .dropdown button{ padding:10px 0; text-align:left; }
    .page-head, .controls, .result-count, .grid{ padding-left:24px; padding-right:24px; }
    .grid{ grid-template-columns: repeat(2, 1fr); }
    footer{ flex-direction:column; gap:14px; text-align:center; padding:24px; }
  }
  @media (max-width: 500px){ .grid{ grid-template-columns: 1fr; } }

  :focus-visible{ outline:1px solid var(--gold-bright); outline-offset:3px; }
</style>
</head>
<body>

<script>
  const SUPABASE_URL = "https://oesjjvrofwlhcxilwaen.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9lc2pqdnJvZndsaGN4aWx3YWVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3Mzg5MDEsImV4cCI6MjEwMDMxNDkwMX0.Tazlir8gkSk8Y-aQMFOjmgadCgOhyaTfV8p8dWi9thw";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const grid = document.getElementById("grid");
  const searchInput = document.getElementById("searchInput");
  const resultCount = document.getElementById("resultCount");
  let ALL_MINIS = [];
  let isMineView = false;
  let currentUserId = null;

  const shieldIcon = `<svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="#c9a24b" stroke-width="1"><path d="M12 2 3 6v6c0 5.2 3.6 9.9 9 11 5.4-1.1 9-5.8 9-11V6l-9-4z"/></svg>`;

  async function loadMinis(){
    isMineView = new URLSearchParams(window.location.search).get("mine") === "true";
    const { data: { session } } = await supabaseClient.auth.getSession();
    currentUserId = session?.user?.id || null;

    if (isMineView && !session){
      window.location.href = "login.html";
      return;
    }

    let query = supabaseClient
      .from("miniatures")
      .select(`
        id, archive_id, title, manufacturer, status, hours_worked, owner_profile_id, painter_name,
        photos ( image_url, photo_type )
      `)
      .order("created_at", { ascending: false });

    if (isMineView){
      query = query.eq("owner_profile_id", session.user.id);
      document.querySelector(".page-head h1").textContent = t("collection_my_title");
      document.querySelector(".eyebrow").textContent = t("collection_my_eyebrow");
    } else {
      query = query.eq("visibility", "public").eq("status", "completed");
    }

    const { data, error } = await query;

    if (error){
      console.error("Failed to load miniatures:", error);
      grid.innerHTML = `<div class="empty-state"><span class="eyebrow">${t("collection_error_eyebrow")}</span>${t("collection_error_desc")}</div>`;
      return;
    }

    ALL_MINIS = (data || []).map(m => {
      const frontPhoto = (m.photos || []).find(p => p.photo_type === "front");
      const anyPhoto = frontPhoto || (m.photos || [])[0];
      const painterLabel = m.painter_name || t("collection_unattributed");
      return {
        id: m.id,
        code: m.archive_id,
        name: m.title,
        manufacturer: m.manufacturer || "—",
        painter: painterLabel,
        hours: m.hours_worked || 0,
        status: m.status,
        ownerProfileId: m.owner_profile_id,
        thumbUrl: anyPhoto?.image_url || null,
      };
    });

    render();
  }

  function render(){
    const query = searchInput.value.trim().toLowerCase();
    const filtered = ALL_MINIS.filter(m => {
      return !query || m.name.toLowerCase().includes(query) || m.painter.toLowerCase().includes(query);
    });

    resultCount.textContent = `${filtered.length}${filtered.length === 1 ? t("collection_result_count_singular") : t("collection_result_count_plural")}`;

    if (filtered.length === 0){
      grid.innerHTML = isMineView
        ? `<div class="empty-state"><span class="eyebrow">${t("collection_empty_mine_eyebrow")}</span>${t("collection_empty_mine_desc")}<a href="edit-record.html" style="color:var(--gold-bright);">${t("collection_empty_mine_link")}</a></div>`
        : `<div class="empty-state"><span class="eyebrow">${t("collection_empty_search_eyebrow")}</span>${t("collection_empty_search_desc")}</div>`;
      return;
    }

    grid.innerHTML = filtered.map(m => {
      const isDraft = m.status === "in_progress";
      const linkTarget = isDraft ? `edit-record.html?id=${m.id}` : `/archive/${encodeURIComponent(m.code)}`;
      const tag = isDraft
        ? `<span class="status-tag wip">${t("collection_status_draft")}</span>`
        : `<span class="id-tag">${m.code}</span>`;
      const editShortcut = (currentUserId && m.ownerProfileId === currentUserId && !isDraft)
        ? `<a href="edit-record.html?id=${m.code}" onclick="event.stopPropagation()" class="card-edit-link" title="${t("edit_this_model_title")}">✎</a>`
        : "";
      return `
        <div class="mini-card">
          <a class="mini-card-link" href="${linkTarget}">
          <div class="thumb">
            ${tag}
            ${m.thumbUrl ? `<img src="${m.thumbUrl}" alt="${m.name}" style="width:100%;height:100%;object-fit:cover;">` : shieldIcon}
          </div>
          <div class="info">
            <div class="name">${m.name}</div>
            <div class="meta">${isDraft ? t("collection_workbench") : `${m.manufacturer} · ${m.painter}`}</div>
          </div>
          </a>
          ${editShortcut}
        </div>
      `;
    }).join("");
  }

  searchInput.addEventListener("input", render);

  loadMinis();
  initLanguage(supabaseClient);

  function onLanguageChanged(){
    loadMinis();
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) renderLoggedInNav(session);
    });
  }

  // ---- Auth nav state ----
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) renderLoggedInNav(session);
  })();

  async function renderLoggedInNav(session){
    const authArea = document.getElementById("authArea");
    if (!authArea) return;

    const { data: profile } = await supabaseClient
      .from("profiles")
      .select("username, display_name, avatar_url")
      .eq("id", session.user.id)
      .maybeSingle();

    const label = profile?.username || profile?.display_name || session.user.email;

    if (profile?.avatar_url){
      document.getElementById("userToggle").innerHTML = `<img src="${profile.avatar_url}" alt="" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">`;
    }
    document.getElementById("userToggle").style.display = "flex";

    authArea.innerHTML = `
      <button class="user-menu-btn" id="userMenuBtn">${label} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="dropdown" id="userDropdown">
        <a href="archive.html?mine=true">${t("nav_my_collection")}</a>
        <a href="edit-record.html">${t("nav_add_model")}</a>
        <a href="account.html">${t("nav_account_settings")}</a>
        <button id="logoutBtn">${t("nav_logout")}</button>
      </div>
    `;

    const btn = document.getElementById("userMenuBtn");
    const dropdown = document.getElementById("userDropdown");
    document.getElementById("userToggleWrap").appendChild(dropdown);
    document.getElementById("userMenu").style.display = "none";
    btn.addEventListener("click", (e) => { e.stopPropagation(); dropdown.classList.toggle("open"); });
    document.addEventListener("click", () => dropdown.classList.remove("open"));

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      window.location.reload();
    });
  }

  const navToggle = document.getElementById("navToggle");
  const navMenu = document.getElementById("navMenu");
  const userToggle = document.getElementById("userToggle");
  const userMenu = document.getElementById("userMenu");
  const navMoreBtn = document.getElementById("navMoreBtn");
  const navMoreMenu = document.getElementById("navMoreMenu");

  navToggle.addEventListener("click", (e) => {
    e.stopPropagation();
    userMenu.classList.remove("open");
    navMenu.classList.toggle("open");
  });
  userToggle.addEventListener("click", (e) => {
    e.stopPropagation();
    navMenu.classList.remove("open");
    userMenu.classList.toggle("open");
    const dropdown = document.getElementById("userDropdown");
    if (dropdown) dropdown.classList.toggle("open");
  });
  const langDropdownBtn = document.getElementById("langDropdownBtn");
  const langDropdownMenu = document.getElementById("langDropdownMenu");

  navMoreBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    langDropdownMenu.classList.remove("open");
    const isOpen = navMoreMenu.classList.toggle("open");
    navMoreBtn.classList.toggle("open", isOpen);
    navMoreBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");
  });
  langDropdownBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    navMoreMenu.classList.remove("open");
    navMoreBtn.classList.remove("open");
    navMoreBtn.setAttribute("aria-expanded", "false");
    langDropdownMenu.classList.toggle("open");
  });
  navMenu.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", () => navMenu.classList.remove("open"));
  });
  userMenu.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", () => userMenu.classList.remove("open"));
  });
  document.addEventListener("click", (e) => {
    if (!navMenu.contains(e.target) && e.target !== navToggle) navMenu.classList.remove("open");
    if (!userMenu.contains(e.target) && e.target !== userToggle) userMenu.classList.remove("open");
    if (!navMoreBtn.contains(e.target) && !navMoreMenu.contains(e.target)){
      navMoreMenu.classList.remove("open");
      navMoreBtn.classList.remove("open");
      navMoreBtn.setAttribute("aria-expanded", "false");
    }
    if (!langDropdownBtn.contains(e.target) && !langDropdownMenu.contains(e.target)){
      langDropdownMenu.classList.remove("open");
    }
  });
</script>

</body>
</html>
